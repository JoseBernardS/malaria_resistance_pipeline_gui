# =======================================================
# Plasmodium falciparum Drug Resistance Pipeline Config
# =======================================================
#
# Canonical, single-source config shared by the desktop GUI and the backend
# worker. Every value uses the ${VAR:-default} form so a caller can override any
# setting at runtime without editing this file:
#   - the backend worker exports env vars (docker run -e VAR=value);
#   - the desktop GUI reads this as a base and writes a per-run .conf with its
#     selections (gui.config_bridge), passing it as $1 / PIPELINE_CONFIG.
# The bin script sources this file, then converts relative paths to absolute, so
# injected relative paths stay container-safe.

# ========================
# INPUT/OUTPUT PATHS
# ========================

# Input data directory containing barcode subdirectories with FASTQ files
FASTQ_PASS_DIR="${FASTQ_PASS_DIR:-data/fastq_pass}"

# Reference files (relative to project root unless absolute)
REFERENCE="${REFERENCE:-data/external/pf-ref/genome/PlasmoDB-68_Pfalciparum3D7_Genome.fasta}"
ORIGINAL_BED_FILE="${ORIGINAL_BED_FILE:-data/interim/targets/pf_snp_targets.PlasmoDB-68.bed}"
ANNOTATION_GFF="${ANNOTATION_GFF:-data/external/pf-ref/annotation/PlasmoDB-68_Pfalciparum3D7.gff}"

# Output directory (will be created if doesn't exist)
OUTPUT_DIR="${OUTPUT_DIR:-results/analysis_output}"

# ========================
# CONDA ENVIRONMENT
# ========================

# Name of conda environment containing pipeline tools
CONDA_ENV="${CONDA_ENV:-nanopore_all}"

# ========================
# CLAIR3 CONFIGURATION
# ========================

# Clair3 is installed natively via conda (bioconda::clair3), no Docker required.
#
# CLAIR3_MODEL_DIR is the model registry: a directory containing one
# subdirectory per model, each holding pileup.pt + full_alignment.pt. A backend
# admin mounts this (e.g. -v /host/models:/models:ro -e CLAIR3_MODEL_DIR=/models)
# to add chemistries without rebuilding the image. Defaults to the baked-in dir,
# which ships the r941_prom_sup_g5014 model.
CLAIR3_MODEL_DIR="${CLAIR3_MODEL_DIR:-data/clair3_models}"

# Clair3 model to use — must be a subdirectory name present in CLAIR3_MODEL_DIR,
# or (from the desktop) an absolute model dir. The model must match the run's
# flowcell chemistry / device / basecaller (e.g. r941_prom_sup_g5014 = R9.4.1 /
# PromethION / sup / Guppy 5.0.14).
CLAIR3_MODEL="${CLAIR3_MODEL:-r941_prom_sup_g5014}"

# ========================
# COMPUTATIONAL RESOURCES
# ========================

# Number of threads to use (adjust based on your system)
THREADS="${THREADS:-24}"

# ========================
# QUALITY CONTROL PARAMETERS
# ========================

# nanostat (fast, stats only) | nanoplot (full plots)
QC_TOOL="${QC_TOOL:-nanostat}"

# Boolean to trigger qc on pretrim sequences, does not by default
RUN_PRETRIM_QC="${RUN_PRETRIM_QC:-false}"

# fraction of a gene's target bases that must be >= MIN_DP to call it covered
COV_MIN_BREADTH="${COV_MIN_BREADTH:-0.8}"

# Minimum QUAL score for variant filtering
MIN_QUAL="${MIN_QUAL:-15}"

# Minimum Read length of sequence (adjust based on amplicon lengths)
MIN_READ_LENGTH="${MIN_READ_LENGTH:-300}"

# Maximum Read length of sequence for the amplicon length filter
MAX_READ_LENGTH="${MAX_READ_LENGTH:-5000}"

# Maximum read length for QC plots (NanoPlot --maxlength cap). Separate from the
# amplicon length filter above so QC plots can show a wider tail without loosening
# the filter that feeds alignment/variant-calling.
QC_MAXLENGTH="${QC_MAXLENGTH:-8000}"

# Minimum read depth for variant filtering
MIN_DP="${MIN_DP:-10}"

# Minimum mapping quality for Clair3
MIN_MQ="${MIN_MQ:-20}"

# Clair3 quality threshold
CLAIR3_QUAL="${CLAIR3_QUAL:-20}"

# Minimum coverage for Clair3
MIN_COVERAGE="${MIN_COVERAGE:-10}"

# Chunk size for Clair3 processing
CHUNK_SIZE="${CHUNK_SIZE:-5000000}"

# Resistance Catalog
RESISTANCE_CATALOG="${RESISTANCE_CATALOG:-data/interim/catalog/pf_resistance_catalog.PlasmoDB-68.tsv}"

# Human-readable reference-set label stamped into the run manifest as the
# offline-capable provenance token. MUST match the GUI/backend native set name
# (gui.config_bridge.NATIVE_REFERENCE_SET_NAME / settings.NATIVE_REFERENCE_SET_NAME)
# so runs resolve/backfill their reference_set_id by exact name. Callers (the
# cloud worker's env var, or the GUI's per-run .conf) override this per run.
REFERENCE_SET_VERSION="${REFERENCE_SET_VERSION:-WHO 2025 / PlasmoDB-68}"

# ========================
# PIPELINE BEHAVIOR
# ========================

# Enable debug mode (pauses between steps)
DEBUG_MODE="${DEBUG_MODE:-false}"

# Keep large per-barcode intermediates (trimmed FASTQs, sorted BAMs) after the
# step that consumes them. false = drop them to reclaim disk (a run's scratch is
# the bulk of its footprint); true = keep them for re-analysis (e.g. read-backed
# haplotype phasing needs the BAM). Ships false (desktop-safe default); the
# backend worker overrides it to true per run for Tier 2 phasing.
KEEP_INTERMEDIATE="${KEEP_INTERMEDIATE:-false}"

# ========================
# REPORTING
# ========================

# PDF report mode: combined | per-sample | both | none
# - combined   : one resistance_report.pdf covering every sample
# - per-sample : one report_<barcode>.pdf per sample
# - both       : produce both
# - none/off/skip : skip PDF generation entirely (CSVs are always produced)
REPORT_MODE="${REPORT_MODE:-combined}"
